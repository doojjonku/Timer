<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>집중 타이머</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --glass: rgba(20, 16, 12, 0.38);
    --glass-strong: rgba(20, 16, 12, 0.55);
    --line: rgba(255, 240, 220, 0.18);
    --text: #fff8ef;
    --muted: rgba(255, 248, 239, 0.68);
    --accent: #f3c27a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #1a140f; color: var(--text); font-family: "Noto Sans KR", system-ui, sans-serif; overflow: hidden; }

  /* 배경 영상 */
  #bg { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
  .shade { position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 40%, rgba(0,0,0,.45) 100%); }

  /* UI 전체: 마우스가 멈추면 사라짐 */
  .ui { position: fixed; top: 20px; right: 20px; z-index: 2; transition: opacity .8s; max-width: calc(100% - 32px); }
  body.idle .ui .fade { opacity: 0; pointer-events: none; }
  body.idle { cursor: none; }
  .fade { transition: opacity .8s; }

  .panel { background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--line); border-radius: 20px; padding: 16px 20px; text-align: center; max-width: 100%; width: 300px; }

  .modes { display: flex; gap: 4px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { background: transparent; border: 1px solid var(--line); color: var(--muted); padding: 4px 10px; border-radius: 999px; font: inherit; font-size: 12px; cursor: pointer; }
  .chip:hover { color: var(--text); }
  .chip.on { background: var(--text); color: #2a2018; border-color: var(--text); }

  .label { font-size: 12px; color: var(--muted); letter-spacing: .08em; min-height: 18px; }
  .time { font-size: 60px; font-weight: 300; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 2px 0 10px; text-shadow: 0 2px 30px rgba(0,0,0,.35); }
  .bar { height: 3px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 0 auto 12px; width: 100%; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .5s linear; }

  .row { display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .btn { background: var(--glass-strong); border: 1px solid var(--line); color: var(--text); padding: 6px 12px; border-radius: 999px; font: inherit; font-size: 13px; cursor: pointer; }
  .btn:hover { background: rgba(255,255,255,.14); }
  .btn.primary { background: var(--text); color: #2a2018; font-weight: 500; min-width: 76px; }
  .custom { display: none; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; margin-bottom: 10px; justify-content: center; }
  .custom.show { display: flex; }
  .custom input { width: 54px; background: var(--glass-strong); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 4px 6px; font: inherit; text-align: center; }
  .count { margin-top: 10px; font-size: 11px; color: var(--muted); }
  /* 화면이 정리된 상태에서는 패널 배경도 사라지고 시간만 남음 */
  .panel { transition: background .8s, border-color .8s, backdrop-filter .8s; }
  body.idle .panel { background: transparent; border-color: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }
  body.idle .bar { opacity: .6; }

  /* 음악 플레이어 */
  .player { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 3;
    display: flex; align-items: center; gap: 12px; padding: 10px 14px 10px 18px; border-radius: 999px;
    background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border: 1px solid var(--line);
    width: min(640px, calc(100% - 32px)); }
  .track { flex: 1; min-width: 0; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track small { color: var(--muted); margin-left: 6px; }
  .icon { background: none; border: 0; color: var(--text); font-size: 18px; width: 34px; height: 34px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; }
  .icon:hover { background: rgba(255,255,255,.14); }
  .icon.on { color: var(--accent); }
  input[type=range] { width: 90px; accent-color: var(--accent); }

  .top { position: fixed; top: 16px; left: 16px; z-index: 3; display: flex; gap: 8px; align-items: center; }
  .hint { font-size: 13px; color: var(--muted); margin-left: 6px; }

  .drop { position: fixed; inset: 0; z-index: 10; display: none; place-items: center; background: rgba(0,0,0,.55); font-size: 22px; border: 3px dashed var(--accent); }
  body.dragging .drop { display: grid; }

  @media (max-width: 560px) {
    .ui { top: 64px; right: 16px; left: 16px; }
    .panel { width: 100%; }
    input[type=range] { display: none; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<video id="bg" autoplay muted loop playsinline poster="images/modern_terrace_alpine.png">
  <source src="clips/loop_slow.mp4" type="video/mp4">
  <source src="clips/loop.mp4" type="video/mp4">
</video>
<div class="shade"></div>

<div class="top fade">
  <button class="icon" id="bgBtn" title="배경 영상 바꾸기">🖼</button>
  <button class="icon" id="fsBtn" title="전체화면 (F)">⛶</button>
  <span class="hint">스페이스: 시작/정지 · F: 전체화면 · M: 음악</span>
</div>

<div class="ui">
  <div class="panel fade-keep">
    <div class="modes fade">
      <button class="chip on" data-min="25" data-break="5" title="25분 집중 후 5분 휴식">집중 모드</button>
      <button class="chip" data-min="50" data-break="10" title="50분 읽기 후 10분 휴식">독서 모드</button>
      <button class="chip" data-mode="sw" title="끝없이 시간을 잽니다">시간 재기</button>    </div>
    <div class="custom fade" id="custom">
      집중 <input type="number" id="cFocus" min="1" max="600" value="30"> 분 ·
      휴식 <input type="number" id="cBreak" min="0" max="120" value="5"> 분
    </div>
    <div class="label" id="label">집중 시간</div>
    <div class="time" id="time">25:00</div>
    <div class="bar"><i id="bar"></i></div>
    <div class="row fade">
      <button class="btn primary" id="startBtn">시작</button>
      <button class="btn" id="resetBtn">초기화</button>
      <button class="btn" id="skipBtn">건너뛰기</button>
    </div>
    <div class="count fade" id="count">오늘 완료한 집중 0회</div>
  </div>
</div>

<div class="player fade">
  <button class="icon" id="prevBtn" title="이전 곡">⏮</button>
  <button class="icon" id="playBtn" title="재생/일시정지 (M)">▶</button>
  <button class="icon" id="nextBtn" title="다음 곡">⏭</button>
  <div class="track" id="track">음악 없음</div>
  <button class="icon" id="shufBtn" title="셔플">🔀</button>
  <input type="range" id="vol" min="0" max="1" step="0.01" value="0.6" title="볼륨">
  <button class="icon" id="addBtn" title="음악 추가 (파일 선택 또는 끌어다 놓기)">＋</button>
</div>

<input type="file" id="musicFiles" accept="audio/*" multiple hidden>
<input type="file" id="bgFile" accept="video/*,image/*" hidden>
<audio id="audio" preload="auto"></audio>
<div class="drop">여기에 음악 파일을 놓으세요 🎵</div>

<script>/* 브라우저가 예전 목록을 기억하지 않도록 매번 새로 읽기 */ document.write('<script src="music/playlist.js?v=' + Date.now() + '"><\/script>');</script>
<script>
/* 기본 음악 목록: music 폴더에 곡을 넣고 "음악목록 갱신.bat"을 실행하면 music/playlist.js가 새로 만들어집니다 */
const DEFAULT_TRACKS = window.PLAYLIST || [];

const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};

/* ---------- 타이머 ---------- */
let focusMin = 25, breakMin = 5, phase = "focus", total = 25 * 60, left = total, running = false, endAt = 0, tick = null;
const today = new Date().toDateString();
let done = store.get("doneDay", "") === today ? store.get("doneCount", 0) : 0;
let focusSec = store.get("focusDay", "") === today ? store.get("focusSec", 0) : 0; // 오늘 실제로 집중한 총 시간(초)
let lastTick = 0;
function fmtTotal(s) {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60);
  return h ? `${h}시간 ${m}분` : `${m}분`;
}
function showCount() { $("count").textContent = `오늘 총 집중 ${fmtTotal(focusSec)} · 완료 ${done}회`; }
showCount();

function fmt(s) {
  s = Math.max(0, Math.ceil(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : String(m).padStart(2, "0")) + ":" + String(sec).padStart(2, "0");
}
let stopwatch = false, elapsed = 0, startAt = 0; // 시간 재기(스톱워치) 모드
function render() {
  if (stopwatch) {
    $("time").textContent = fmt(Math.floor(elapsed));
    $("bar").style.width = "0%";
    $("label").textContent = "시간 재기 ⏱";
    document.title = running ? `${fmt(Math.floor(elapsed))} · 시간 재기` : "집중 타이머";
    $("startBtn").textContent = running ? "일시정지" : (elapsed > 0 ? "계속" : "시작");
    $("skipBtn").style.display = "none";
    return;
  }
  $("skipBtn").style.display = "";
  $("time").textContent = fmt(left);
  $("bar").style.width = (100 * (1 - left / total)) + "%";
  $("label").textContent = phase === "focus" ? "집중 시간" : "휴식 시간 ☕";
  document.title = running ? `${fmt(left)} · ${phase === "focus" ? "집중" : "휴식"}` : "집중 타이머";
  $("startBtn").textContent = running ? "일시정지" : (left < total ? "계속" : "시작");
}
function setPhase(p) {
  phase = p; elapsed = 0;
  total = left = (p === "focus" ? focusMin : breakMin) * 60;
  render();
}
function start() {
  if (stopwatch) {
    running = true; startAt = Date.now() - elapsed * 1000; lastTick = Date.now();
    clearInterval(tick); tick = setInterval(step, 250);
    if (audioList.length && audio.paused && store.get("autoMusic", true)) playMusic();
    return render();
  }
  if (left <= 0) return;
  running = true; endAt = Date.now() + left * 1000; lastTick = Date.now();
  clearInterval(tick); tick = setInterval(step, 250);
  if (phase === "focus" && audioList.length && audio.paused && store.get("autoMusic", true)) playMusic();
  render();
}
function pause() { running = false; clearInterval(tick); render(); }
function step() {
  const now = Date.now();
  if (stopwatch) {
    focusSec += (now - lastTick) / 1000; lastTick = now;
    store.set("focusDay", today); store.set("focusSec", focusSec);
    elapsed = (now - startAt) / 1000;
    showCount(); return render();
  }
  if (phase === "focus") {
    focusSec += Math.min(now, endAt) / 1000 - lastTick / 1000;
    store.set("focusDay", today); store.set("focusSec", focusSec);
    showCount();
  }
  lastTick = now;
  left = (endAt - now) / 1000;
  if (left <= 0) { left = 0; finish(); }
  render();
}
function finish() {
  pause(); chime();
  if (phase === "focus") {
    done++; store.set("doneDay", today); store.set("doneCount", done);
    showCount();
    if (breakMin > 0) { setPhase("break"); start(); } else setPhase("focus");
  } else { setPhase("focus"); }
}
function chime() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523.25, 659.25, 783.99].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + i * 0.35;
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.25, t + 0.05); g.gain.exponentialRampToValueAtTime(0.001, t + 1.6);
      o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 1.7);
    });
  } catch {}
}

$("startBtn").onclick = () => running ? pause() : start();
$("resetBtn").onclick = () => { pause(); setPhase("focus"); };
$("skipBtn").onclick = () => { pause(); setPhase(phase === "focus" ? "break" : "focus"); };
document.querySelectorAll(".chip").forEach(c => c.onclick = () => {
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x === c));
  pause();
  stopwatch = c.dataset.mode === "sw";
  if (!stopwatch) { focusMin = +c.dataset.min; breakMin = +c.dataset.break; }
  setPhase("focus");
});
["cFocus", "cBreak"].forEach(id => $(id).oninput = () => {
  focusMin = Math.max(1, +$("cFocus").value || 1); breakMin = Math.max(0, +$("cBreak").value || 0);
  pause(); setPhase("focus");
});

/* ---------- 음악 ---------- */
const audio = $("audio");
let audioList = DEFAULT_TRACKS.map(src => ({ src: encodeURI(src), name: src.split("/").pop().replace(/\.[^.]+$/, "").replace(/^\d+_/, "") }));
let cur = 0, shuffle = store.get("shuffle", false);
audio.volume = $("vol").value = store.get("vol", 0.6);
$("shufBtn").classList.toggle("on", shuffle);

function showTrack() {
  $("track").innerHTML = audioList.length
    ? `${audioList[cur].name}<small>${cur + 1} / ${audioList.length}</small>` : "음악 없음 · ＋로 추가하세요";
  $("playBtn").textContent = audio.paused ? "▶" : "⏸";
}
function load(i) { cur = (i + audioList.length) % audioList.length; audio.src = audioList[cur].src; showTrack(); }
function playMusic() { if (!audioList.length) return $("musicFiles").click(); if (!audio.src) load(cur); audio.play().catch(() => {}); }
function next() {
  if (!audioList.length) return;
  load(shuffle && audioList.length > 1 ? (cur + 1 + Math.floor(Math.random() * (audioList.length - 1))) : cur + 1);
  audio.play().catch(() => {});
}
audio.onended = next;
audio.onplay = audio.onpause = showTrack;
audio.onerror = () => { // 파일이 없으면 목록에서 빼고 다음 곡으로
  audioList.splice(cur, 1); if (audioList.length) { load(cur); audio.play().catch(() => {}); } else { audio.removeAttribute("src"); showTrack(); }
};
$("playBtn").onclick = () => audio.paused ? playMusic() : audio.pause();
$("nextBtn").onclick = next;
$("prevBtn").onclick = () => { if (audio.currentTime > 3) audio.currentTime = 0; else { load(cur - 1); audio.play().catch(() => {}); } };
$("shufBtn").onclick = () => { shuffle = !shuffle; store.set("shuffle", shuffle); $("shufBtn").classList.toggle("on", shuffle); };
$("vol").oninput = e => { audio.volume = +e.target.value; store.set("vol", audio.volume); };

function addFiles(files) {
  const fresh = [...files].filter(f => f.type.startsWith("audio/")).map(f => ({ src: URL.createObjectURL(f), name: f.name.replace(/\.[^.]+$/, "") }));
  if (!fresh.length) return;
  const wasEmpty = !audioList.length;
  audioList.push(...fresh);
  if (wasEmpty) { load(0); audio.play().catch(() => {}); } else showTrack();
}
$("addBtn").onclick = () => $("musicFiles").click();
$("musicFiles").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
let dragDepth = 0;
addEventListener("dragenter", e => { e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
addEventListener("dragover", e => e.preventDefault());
addEventListener("drop", e => { e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging"); addFiles(e.dataTransfer.files); });

/* ---------- 배경 바꾸기 ---------- */
$("bgBtn").onclick = () => $("bgFile").click();
$("bgFile").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const url = URL.createObjectURL(f), v = $("bg");
  if (f.type.startsWith("image/")) { v.pause(); v.removeAttribute("src"); v.querySelectorAll("source").forEach(s => s.remove()); v.poster = url; v.load(); }
  else { v.querySelectorAll("source").forEach(s => s.remove()); v.src = url; v.play().catch(() => {}); }
  e.target.value = "";
};

/* ---------- 전체화면 · 단축키 · 자동 숨김 ---------- */
$("fsBtn").onclick = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen().catch(() => {});
addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") return;
  if (e.code === "Space") { e.preventDefault(); running ? pause() : start(); }
  else if (e.key === "f" || e.key === "F") $("fsBtn").click();
  else if (e.key === "m" || e.key === "M") $("playBtn").click();
});
let idleTimer;
function wake() {
  document.body.classList.remove("idle");
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => { if (running || !audio.paused) document.body.classList.add("idle"); }, 4000);
}
["mousemove", "mousedown", "keydown", "touchstart"].forEach(ev => addEventListener(ev, wake, { passive: true }));

showTrack(); render(); wake();
</script>
</body>
</html>
